name: Feature request
description: Propose a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What are you trying to do that you cannot? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal, description: What would you change? Note any effect on authentication, authorization or isolation. }
    validations: { required: true }
